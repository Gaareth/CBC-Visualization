[[repos]]
repo = "local"
hooks = [
    { id = "prettier", name = "prettier", entry = "pnpm format", language = "system", pass_filenames = false, stages = [
        "pre-commit",
    ] },
    { id = "eslint", name = "eslint", entry = "pnpm eslint:fix", language = "system", pass_filenames = false, stages = [
        "pre-commit",
    ] },

    { id = "check", name = "svelte-check", entry = "pnpm check", language = "system", pass_filenames = false, stages = [
        "pre-push",
    ] },

    { id = "test", name = "vitest", entry = "pnpm test:unit --run", language = "system", pass_filenames = false, stages = [
        "pre-push",
    ] },
]
